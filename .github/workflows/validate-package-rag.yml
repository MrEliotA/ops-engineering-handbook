name: validate-package-rag
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install QA dependencies
        run: python -m pip install --upgrade pytest ruff PyYAML
      - name: Validate frontmatter
        run: python scripts/rag/validate_frontmatter.py .
      - name: Check links
        run: python scripts/quality/check_links.py .
      - name: Python QA
        run: |
          ruff check scripts tests
          python -m compileall -q scripts tests
          pytest -q
      - name: Shell QA
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Build package
        run: python scripts/quality/build_release_zip.py --root . --output engineering-handbook-ready-to-push.zip
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-handbook
          path: engineering-handbook-ready-to-push.zip
          if-no-files-found: error
