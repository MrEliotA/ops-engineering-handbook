[project]
name = "engineering-handbook-tools"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rag = ["openai>=1.0", "qdrant-client>=1.9", "PyYAML>=6"]
dev = ["pytest>=8", "ruff>=0.16.4", "PyYAML>=6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F"]
